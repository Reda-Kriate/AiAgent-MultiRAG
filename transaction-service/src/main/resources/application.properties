spring.application.name=transaction-service
server.port=8091
spring.datasource.url=jdbc:h2:mem:transactions-db
spring.h2.console.enabled=true

langchain4j.open-ai.chat-model.model-name=openai/gpt-oss-20b
langchain4j.open-ai.chat-model.api-key=${GROQ_API}
langchain4j.open-ai.chat-model.base-url=https://api.groq.com/openai/v1
langchain4j.open-ai.chat-model.temperature=0.5

langchain4j.open-ai.streaming-chat-model.model-name=openai/gpt-oss-20b
langchain4j.open-ai.streaming-chat-model.api-key=${GROQ_API}
langchain4j.open-ai.streaming-chat-model.base-url=https://api.groq.com/openai/v1
langchain4j.open-ai.streaming-chat-model.temperature=0.5



# Logging properties
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true

langchain4j.open-ai.streaming-chat-model.log-requests=true
langchain4j.open-ai.streaming-chat-model.log-responses=false

logging.level.dev.langchain4j=DEBUG
logging.level.dev.ai4j.openai4j=DEBUG
logging.level.ai.djl=OFF
# For Uploads Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
