<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="card shadow" style="width:80%; height:600px;">
    <div class="card-header bg-primary text-white text-center fw-bold">
      Chatbot
    </div>
    <div class="card-body d-flex flex-column justify-content-end">

      <div class="input-group mb-3">
        <input type="text" class="form-control" placeholder="Posez votre question..." [(ngModel)]="question">
        <button class="btn btn-primary" (click)="askAgent()">Ask Agent</button>
      </div>


              @if (response){
                <div class="border rounded p-3 bg-light mb-3" style="max-height:450px; overflow-y:auto;">
                  <markdown [data]="response"></markdown>
                            @for (image of images;track image){
                              <div>
                                <img style="max-width:100%; height:auto; object-fit:contain;" class="img-fluid rounded mb-2" src="{{image}}">
                              </div>
                            }
                </div>
            }
